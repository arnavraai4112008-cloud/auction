<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 Multiplayer Auction Game</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #fbbf24;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
        }

        .room-info h1 {
            font-size: 1.2rem;
            color: var(--accent-gold);
        }

        .room-code {
            background: #000;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            flex-direction: row;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        .auction-stage {
            flex: 2;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .player-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-gold);
            margin-bottom: 15px;
        }

        .player-name {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .player-role {
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        .stat-box {
            background-color: var(--primary-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .bidding-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-bg);
            border: 4px solid var(--danger);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--danger);
        }

        .current-bid {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .highest-bidder {
            color: var(--success);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .btn-bid {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            width: 80%;
            max-width: 300px;
        }

        .btn-bid:hover:not(:disabled) {
            background-color: #f59e0b;
            transform: scale(1.05);
        }

        .btn-bid:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn-bid:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #999;
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-box {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .panel-box h3 {
            color: var(--accent-gold);
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .log-item, .roster-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }

        .purse-remaining {
            font-size: 1.5rem;
            color: var(--success);
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        #bidding-log {
            max-height: 200px;
            overflow-y: auto;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .player-photo { width: 150px; height: 150px; }
            header { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>

    <header>
        <div class="room-info">
            <h1>🏏 IPL 2026 Mega Auction Game</h1>

                    <div class="highest-bidder" id="highest-bidder-display">Base Price</div>
                </div>

                <button class="btn-bid" id="bid-btn" onclick="placeBid()">Bid +₹ 50 Lakhs</button>
            </div>
        </main>

        <aside class="side-panel">
            <div class="panel-box">
                <h3>Your Franchise Status</h3>
                <div class="purse-remaining" id="purse-display">₹ 120.00 Cr</div>
                <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Remaining Purse</p>
                
                <h4 style="margin-bottom: 10px; color: var(--text-light);" id="squad-points-display">Current Squad Points: 0</h4>
                <div id="roster-list">
                    </div>
            </div>

            <div class="panel-box">
                <h3>Live Bidding Log</h3>
                <div id="bidding-log">
                    </div>
            </div>
        </aside>

    </div>

        let myTotalPoints = 0;

        // 2. UI Elements
        const timerDisplay = document.getElementById('timer-display');
        const currentBidDisplay = document.getElementById('current-bid-display');
        const highestBidderDisplay = document.getElementById('highest-bidder-display');
        const biddingLog = document.getElementById('bidding-log');
        const bidBtn = document.getElementById('bid-btn');
        const purseDisplay = document.getElementById('purse-display');
        
        const uiPlayerName = document.getElementById('ui-player-name');
        const uiPlayerRole = document.getElementById('ui-player-role');
        const uiPlayerPhoto = document.getElementById('ui-player-photo');
        const uiStatsGrid = document.getElementById('ui-stats-grid');
        const rosterList = document.getElementById('roster-list');
        const squadPointsDisplay = document.getElementById('squad-points-display');

        // 3. Load Next Player Function
        function loadNextPlayer() {
            if (typeof playersData === 'undefined') {
                alert("Error: Make sure players.js is in the same folder as this HTML file!");
                return;
            }

            // Pick a random player from the full 350 list
            const randomIdx = Math.floor(Math.random() * playersData.length);
            currentPlayer = playersData[randomIdx];

            // Update Stage UI
            uiPlayerName.innerText = currentPlayer.name;
            uiPlayerRole.innerText = `${currentPlayer.role} | ${currentPlayer.country}`;
            uiPlayerPhoto.src = currentPlayer.image;
            
            // Build Dynamic Stats UI based on roles
            let statsHTML = '';
            if (currentPlayer.stats.runs) {
                statsHTML += `<div class="stat-box"><div class="stat-value">${currentPlayer.stats.runs}</div><div class="stat-label">IPL Runs</div></div>`;
                statsHTML += `<div class="stat-box"><div class="stat-value">${currentPlayer.stats.strikeRate}</div><div class="stat-label">Strike Rate</div></div>`;
            }
            if (currentPlayer.stats.wickets) {
                statsHTML += `<div class="stat-box"><div class="stat-value">${currentPlayer.stats.wickets}</div><div class="stat-label">IPL Wickets</div></div>`;
                statsHTML += `<div class="stat-box"><div class="stat-value">${currentPlayer.stats.economy}</div><div class="stat-label">Economy</div></div>`;
            }
            statsHTML += `<div class="stat-box"><div class="stat-value">${currentPlayer.stats.statPointsYield}</div><div class="stat-label">Points Yield</div></div>`;
            uiStatsGrid.innerHTML = statsHTML;

            // Reset Bidding State
            currentBidInCr = currentPlayer.basePriceCr;
            currentBidDisplay.innerText = `₹ ${currentBidInCr.toFixed(2)} Cr`;
            highestBidderDisplay.innerText = "Base Price";
            highestBidderDisplay.style.color = "var(--text-muted)";
            biddingLog.innerHTML = ""; // Clear old logs
            
            bidBtn.disabled = false;
            bidBtn.innerText = "Bid +₹ 50 Lakhs";
            auctionActive = true;

            // Start Timer
            timerSeconds = 15;
            startTimer();
        }

        // 4. Timer Logic
        function startTimer() {
            clearInterval(countdownInterval);
            timerDisplay.innerText = timerSeconds < 10 ? "0" + timerSeconds : timerSeconds;
            
            countdownInterval = setInterval(() => {
                timerSeconds--;
                timerDisplay.innerText = timerSeconds < 10 ? "0" + timerSeconds : timerSeconds;

                if (timerSeconds <= 0) {
                    clearInterval(countdownInterval);
                    playerSold();
                }
            }, 1000);
        }

        // 5. Bidding Logic
        function placeBid() {
            if (!auctionActive) return;

            currentBidInCr += 0.50; // Increase by 50L
            
            if (currentBidInCr > myPurse) {
                alert("You don't have enough purse remaining!");
                currentBidInCr -= 0.50; // Revert
                return;
            }

            // Update UI
            currentBidDisplay.innerText = `₹ ${currentBidInCr.toFixed(2)} Cr`;
            highestBidderDisplay.innerText = "Highest Bidder: YOU";
            highestBidderDisplay.style.color = "var(--success)";

            addLogEntry("YOU", currentBidInCr.toFixed(2));

            // Reset timer
            timerSeconds = 15;
            timerDisplay.innerText = timerSeconds;
            startTimer();
        }

        // 6. Add Log
        function addLogEntry(team, amount) {
            const newLog = document.createElement('div');
            newLog.className = 'log-item';
            newLog.innerHTML = `<span>${team} bid</span><span style="color: var(--accent-gold)">₹ ${amount} Cr</span>`;
            biddingLog.insertBefore(newLog, biddingLog.firstChild);
        }

        // 7. Player Sold Logic
        function playerSold() {
            auctionActive = false;
            bidBtn.disabled = true;
            bidBtn.innerText = "SOLD!";
            timerDisplay.innerText = "00";
            
            highestBidderDisplay.innerText = `SOLD for ₹ ${currentBidInCr.toFixed(2)} Cr!`;
            
            // Deduct money and update points
            myPurse -= currentBidInCr;
            myTotalPoints += currentPlayer.stats.statPointsYield;
            
            purseDisplay.innerText = `₹ ${myPurse.toFixed(2)} Cr`;
            squadPointsDisplay.innerText = `Current Squad Points: ${myTotalPoints}`;
            
            // Add to roster UI
            const rosterItem = document.createElement('div');
            rosterItem.className = 'roster-item';
            rosterItem.innerHTML = `<span>${currentPlayer.name}</span><span style="color: var(--success)">+${currentPlayer.stats.statPointsYield} pts</span>`;
            rosterList.appendChild(rosterItem);

            // Wait 3 seconds, load next player
            setTimeout(() => {
                loadNextPlayer();
            }, 3000); 
        }

        // 8. Start the game on load
        window.onload = () => {
            loadNextPlayer();
        };
    </script>
</body>
</html>
